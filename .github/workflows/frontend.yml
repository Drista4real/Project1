name: Flutter checks

on:
  workflow_dispatch:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.3'
          channel: stable
          cache: true
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze Flutter
        run: flutter analyze --no-pub
      - name: Run unit and widget tests
        run: |
          mkdir -p test-reports
          set -o pipefail
          flutter test --no-pub --coverage --reporter expanded 2>&1 | tee test-reports/flutter.txt
      - name: Build Android debug APK (without generated offline ASR models)
        run: flutter build apk --debug --no-pub
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/test-reports/
            frontend/coverage/lcov.info
          retention-days: 7
