name: Selenium web browsers

on:
  workflow_dispatch:
  push:
    paths:
      - 'frontend/**'
      - 'tests/browser/**'
      - '.github/workflows/selenium-web.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'tests/browser/**'
      - '.github/workflows/selenium-web.yml'

permissions:
  contents: read

concurrency:
  group: selenium-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.41.3'
          channel: stable
          cache: true
      - name: Resolve locked Flutter dependencies
        working-directory: frontend
        run: flutter pub get --enforce-lockfile
      - name: Build isolated web smoke bundle
        run: python tests/browser/build_web.py
      - uses: actions/upload-artifact@v4
        with:
          name: selenium-web-${{ github.run_id }}-${{ github.run_attempt }}
          path: frontend/build/web/
          if-no-files-found: error
          retention-days: 3

  browser-smoke:
    needs: build-web
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, edge, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/browser/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: selenium-web-${{ github.run_id }}-${{ github.run_attempt }}
          path: frontend/build/web/
      - name: Install pinned browser test tools
        run: python -m pip install -r tests/browser/requirements.txt
      - name: Run Selenium smoke on ${{ matrix.browser }}
        env:
          SE_CACHE_PATH: ${{ runner.temp }}/selenium
        run: python tests/browser/run.py --browser ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selenium-${{ matrix.browser }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/browser/artifacts/${{ matrix.browser }}/
          if-no-files-found: warn
          retention-days: 7

  selenium-gate:
    name: Selenium browser gate
    needs: [build-web, browser-smoke]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require build and all browsers to pass
        env:
          BUILD_RESULT: ${{ needs.build-web.result }}
          BROWSER_RESULT: ${{ needs.browser-smoke.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$BROWSER_RESULT" = success
