name: Backend Java E2E

on:
  workflow_dispatch:
  push:
    paths:
      - 'backend/**'
      - 'frontend/supabase/**'
      - 'tests/backend-e2e/**'
      - '.github/workflows/backend-java-e2e.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/supabase/**'
      - 'tests/backend-e2e/**'
      - '.github/workflows/backend-java-e2e.yml'

permissions:
  contents: read

concurrency:
  group: backend-java-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: tests/backend-e2e
    env:
      COMPOSE_PROJECT_NAME: e2e-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_FILE: compose.yaml
      COMPOSE_ENV_FILES: .env.ci
    steps:
      - uses: actions/checkout@v4
      - name: Generate disposable test credentials
        run: python3 docker/generate_env.py
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build backend and Java runner
        run: docker compose build --pull
      - name: Start isolated backend and database
        run: docker compose up --detach --wait --wait-timeout 240 api
      - name: Run Java integration and API tests in Docker
        run: docker compose run --name "${COMPOSE_PROJECT_NAME}-tests" --no-deps tests
      - name: Collect test reports and container logs
        if: always()
        run: |
          mkdir -p artifacts
          docker compose logs --no-color > artifacts/containers.log 2>&1 || true
          docker compose ps --all > artifacts/containers-status.txt 2>&1 || true
          docker cp "${COMPOSE_PROJECT_NAME}-tests:/tests/target/failsafe-reports" artifacts/failsafe-reports || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-java-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/backend-e2e/artifacts/
          retention-days: 7
      - name: Remove disposable containers and data
        if: always()
        run: |
          docker compose down --volumes --remove-orphans
          rm -f .env.ci
