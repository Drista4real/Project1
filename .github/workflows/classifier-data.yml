name: Classifier data pipeline

on:
  workflow_dispatch:
  push:
    paths:
      - 'backend/scripts/dataset_pipeline.py'
      - 'backend/scripts/prepare_classifier_data.py'
      - 'backend/app/infrastructure/ai/classifier/config.py'
      - 'backend/pyproject.toml'
      - 'tests/datasets/**'
      - 'data/taxonomy/**'
      - '.github/workflows/classifier-data.yml'
  pull_request:
    paths:
      - 'backend/scripts/dataset_pipeline.py'
      - 'backend/scripts/prepare_classifier_data.py'
      - 'backend/app/infrastructure/ai/classifier/config.py'
      - 'backend/pyproject.toml'
      - 'tests/datasets/**'
      - 'data/taxonomy/**'
      - '.github/workflows/classifier-data.yml'

permissions:
  contents: read

jobs:
  dataset-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test tools without ML dependencies
        run: python -m pip install --only-binary=:all: pytest==9.1.1 ruff==0.17.0
      - name: Lint dataset pipeline
        run: python -m ruff check --config backend/pyproject.toml backend/scripts/dataset_pipeline.py backend/scripts/prepare_classifier_data.py tests/datasets
      - name: Verify data integrity and split invariants
        run: python -m pytest -c backend/pyproject.toml --noconftest tests/datasets -q
