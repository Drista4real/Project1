# Overlay tests/backend-e2e/compose.yaml. All paths resolve against that base file.
services:
  api:
    ports: ["127.0.0.1:18000:8000"]
    environment:
      CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
  gateway:
    ports: ["127.0.0.1:18001:8000"]
    volumes:
      - ../../dev/local/nginx.conf:/etc/nginx/conf.d/default.conf:ro
  auth:
    environment:
      API_EXTERNAL_URL: http://localhost:18001/auth/v1
      GOTRUE_SITE_URL: http://localhost:5173
      GOTRUE_URI_ALLOW_LIST: http://localhost:5173/**,http://127.0.0.1:5173/**
  mailpit:
    ports: ["127.0.0.1:18025:8025"]
  migrate:
    volumes:
      - ../../dev/local/migrate.sh:/migrate.sh:ro
