map $http_origin $demo_origin {
    default "";
    "http://localhost:5173" $http_origin;
    "http://127.0.0.1:5173" $http_origin;
}
server {
    listen 8000;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    add_header Access-Control-Allow-Origin $demo_origin always;
    add_header Access-Control-Allow-Credentials true always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "apikey, authorization, content-type, x-client-info, x-supabase-api-version" always;
    add_header Vary Origin always;
    if ($request_method = OPTIONS) { return 204; }
    location = /test-otp.html { root /usr/share/nginx/html; }
    location /auth/v1/ {
        proxy_pass http://auth:9999/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto http;
    }
    location /rest/v1/ {
        proxy_pass http://rest:3000/;
        proxy_set_header Host $host;
    }
}
