# Dedicated disposable CI stack. No host ports or production .env files.
services:
  db:
    image: supabase/postgres:17.6.1.136
    command: [postgres, -c, config_file=/etc/postgresql/postgresql.conf]
    environment:
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:?Generate .env.ci first}
      PGPASSWORD: ${TEST_DB_PASSWORD:?}
      POSTGRES_DB: postgres
      PGDATABASE: postgres
      PGPORT: 5432
      POSTGRES_PORT: 5432
      POSTGRES_HOST: /var/run/postgresql
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-test-roles.sql:ro
    healthcheck:
      test: [CMD, pg_isready, -U, supabase_admin, -h, 127.0.0.1, -d, postgres]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 30s

  auth:
    image: supabase/gotrue:v2.196.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://gateway:8000/auth/v1
      GOTRUE_SITE_URL: http://api:8000
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${TEST_DB_PASSWORD:?}@db:5432/postgres
      GOTRUE_JWT_SECRET: ${TEST_JWT_SECRET:?}
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_EXP: 3600
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 10000
      GOTRUE_RATE_LIMIT_SIGN_UPS: 10000
      GOTRUE_RATE_LIMIT_TOKEN_REFRESH: 10000
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1:9999/health]
      interval: 3s
      timeout: 5s
      retries: 40

  migrate:
    image: postgres:17.6-alpine
    depends_on:
      auth:
        condition: service_healthy
    environment:
      PGHOST: db
      PGDATABASE: postgres
      PGUSER: supabase_admin
      PGPASSWORD: ${TEST_DB_PASSWORD:?}
    volumes:
      - ../../frontend/supabase/schema.sql:/schema.sql:ro
      - ../../backend/supabase/migrations:/migrations:ro
      - ./docker/migrate.sh:/migrate.sh:ro
    entrypoint: [sh, /migrate.sh]

  rest:
    image: postgrest/postgrest:v14.17
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGRST_DB_URI: postgres://authenticator:${TEST_DB_PASSWORD:?}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${TEST_JWT_SECRET:?}
      PGRST_ADMIN_SERVER_PORT: 3001
    healthcheck:
      test: [CMD, postgrest, --ready]
      interval: 3s
      timeout: 5s
      retries: 30

  gateway:
    image: nginx:1.28.0-alpine
    depends_on:
      auth:
        condition: service_healthy
      rest:
        condition: service_healthy
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1:8000/auth/v1/health]
      interval: 3s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ../../backend
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      SUPABASE_URL: http://gateway:8000
      SUPABASE_PUBLISHABLE_KEY: ${TEST_ANON_KEY:?}
      CORS_ORIGINS: '[]'
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 30

  tests:
    build:
      context: .
    depends_on:
      api:
        condition: service_healthy
    environment:
      GITHUB_ACTIONS: ${GITHUB_ACTIONS:?This suite runs on GitHub Actions only}
      API_BASE_URL: http://api:8000
      SUPABASE_URL: http://gateway:8000
      SUPABASE_ANON_KEY: ${TEST_ANON_KEY:?}

volumes:
  db-data:
