server {
    listen 8000;
    # Internal test gateway: Auth and PostgREST still validate user JWTs.
    # No admin routes, dashboard, storage or production gateway configuration.
    location /auth/v1/ {
        proxy_pass http://auth:9999/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto http;
    }
    location /rest/v1/ {
        proxy_pass http://rest:3000/;
        proxy_set_header Host $host;
    }
}
