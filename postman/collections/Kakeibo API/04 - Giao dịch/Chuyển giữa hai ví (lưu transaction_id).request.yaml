$kind: http-request
description: Điền to_account_id của ví thứ hai, khác account_id. Không gửi category_id.
url: "{{base_url}}/api/v1/transactions"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "amount": "10000.00",
      "transaction_type": "transfer",
      "account_id": {{account_id}},
      "to_account_id": {{to_account_id}},
      "raw_description": "Chuyển ví thử Postman"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 201", function () { pm.response.to.have.status(201); });
      if (pm.response.code === 201) {
        const data = pm.response.json();
        pm.environment.set("transaction_id", String(data.id));
      }
    language: text/javascript
order: 8000
