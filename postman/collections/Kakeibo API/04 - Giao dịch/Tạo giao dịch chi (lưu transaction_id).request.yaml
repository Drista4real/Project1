$kind: http-request
description: Chạy lấy ví/danh mục trước. Làm thay đổi số dư ví đã chọn.
url: "{{base_url}}/api/v1/transactions"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "amount": "45000.00",
      "transaction_type": "expense",
      "account_id": {{account_id}},
      "category_id": {{expense_category_id}},
      "raw_description": "Cà phê thử Postman"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 201", function () { pm.response.to.have.status(201); });
      if (pm.response.code === 201) {
        const data = pm.response.json();
        pm.environment.set("transaction_id", String(data.id));
      }
    language: text/javascript
order: 3000
