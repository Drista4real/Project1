$kind: http-request
description: Xóa giao dịch mang transaction_id hiện tại. Trigger cập nhật lại số dư.
url: "{{base_url}}/api/v1/transactions/{{transaction_id}}"
method: DELETE
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 204", function () { pm.response.to.have.status(204); });
      if (pm.response.code === 204) pm.environment.unset("transaction_id");
    language: text/javascript
order: 6000
