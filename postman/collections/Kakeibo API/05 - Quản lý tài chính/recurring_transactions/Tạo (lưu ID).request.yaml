$kind: http-request
description: ""
url: "{{base_url}}/api/v1/manage/recurring_transactions"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "amount": "100000.00",
      "transaction_type": "expense",
      "description": "Định kỳ thử Postman",
      "frequency": "monthly",
      "start_date": "{{today}}",
      "next_execution_date": "{{today}}",
      "auto_create": false
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 201", function () { pm.response.to.have.status(201); });
      if (pm.response.code === 201) {
        const data = pm.response.json();
        pm.environment.set("manage_recurring_transactions_id", String(data.id));
      }
    language: text/javascript
order: 2000
