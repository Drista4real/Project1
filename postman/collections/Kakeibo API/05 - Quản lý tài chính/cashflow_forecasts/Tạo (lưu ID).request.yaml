$kind: http-request
description: ""
url: "{{base_url}}/api/v1/manage/cashflow_forecasts"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "forecast_date": "{{today}}",
      "predicted_balance": "1000000.00",
      "risk_level": "safe",
      "model_name": "postman-example"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 201", function () { pm.response.to.have.status(201); });
      if (pm.response.code === 201) {
        const data = pm.response.json();
        pm.environment.set("manage_cashflow_forecasts_id", String(data.id));
      }
    language: text/javascript
order: 2000
