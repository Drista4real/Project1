$kind: http-request
description: ""
url: "{{base_url}}/api/v1/manage/cashflow_alerts"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "alert_type": "low_balance",
      "severity": "info",
      "title": "Cảnh báo thử Postman",
      "message": "Bản ghi mẫu để kiểm tra CRUD."
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 201", function () { pm.response.to.have.status(201); });
      if (pm.response.code === 201) {
        const data = pm.response.json();
        pm.environment.set("manage_cashflow_alerts_id", String(data.id));
      }
    language: text/javascript
order: 2000
