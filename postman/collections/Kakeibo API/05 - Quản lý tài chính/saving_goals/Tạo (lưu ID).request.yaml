$kind: http-request
description: ""
url: "{{base_url}}/api/v1/manage/saving_goals"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Quỹ thử Postman",
      "target_amount": "10000000.00",
      "current_amount": "0.00"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 201", function () { pm.response.to.have.status(201); });
      if (pm.response.code === 201) {
        const data = pm.response.json();
        pm.environment.set("manage_saving_goals_id", String(data.id));
      }
    language: text/javascript
order: 2000
