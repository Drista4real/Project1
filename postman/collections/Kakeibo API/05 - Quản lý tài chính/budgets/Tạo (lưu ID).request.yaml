$kind: http-request
description: ""
url: "{{base_url}}/api/v1/manage/budgets"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "month_year": "{{month_start}}",
      "pillar": "needs",
      "limit_amount": "5000000.00",
      "alert_threshold_percent": 80
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 201", function () { pm.response.to.have.status(201); });
      if (pm.response.code === 201) {
        const data = pm.response.json();
        pm.environment.set("manage_budgets_id", String(data.id));
      }
    language: text/javascript
order: 2000
